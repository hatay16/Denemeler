<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkiye – Filistin | Kardeşlik</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 42%,rgba(28,92,68,.45),transparent 48%),linear-gradient(135deg,#071b18,#101827 55%,#190f17)}
.stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(2px 2px at 15% 25%,#ffffff9c 50%,transparent 60%),radial-gradient(1px 1px at 72% 18%,#ffffffa0 50%,transparent 60%),radial-gradient(2px 2px at 84% 72%,#ffffff70 50%,transparent 60%),radial-gradient(1px 1px at 32% 81%,#ffffff90 50%,transparent 60%),radial-gradient(1px 1px at 55% 58%,#ffffff80 50%,transparent 60%);animation:twinkle 5s ease-in-out infinite alternate}
.stars:before{transform:translate(25px,18px) scale(1.2);opacity:.45;animation-delay:-2s}.stars:after{transform:translate(-20px,-15px) scale(.8);opacity:.5;animation-delay:-3s}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.wrap{width:min(1000px,92vw);text-align:center;position:relative;z-index:1;padding:32px 12px}
.intro{animation:fadeUp 1s both}.intro p{color:#cbd5d1;letter-spacing:.22em;text-transform:uppercase;font-size:.78rem}
.open{margin-top:24px;padding:16px 30px;border:1px solid #ffffff70;border-radius:999px;background:linear-gradient(110deg,#087b4b,#c51e2b);color:white;font-size:1rem;font-weight:800;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 35px #0007;transition:transform .25s,box-shadow .25s}
.open:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 40px #0009}
.main{display:none}.main.show{display:block;animation:reveal 1.1s both}
.eyebrow{color:#d8e5df;font-size:.9rem;letter-spacing:.38em;margin-bottom:24px}
h1{margin:0 auto;max-width:950px;font-size:clamp(2.7rem,8vw,6.7rem);line-height:.99;font-weight:950;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 8px 35px #0009}
h1 span{display:block}.line-one{color:#fff;animation:textIn 1.1s .2s both}
.line-two{margin-top:13px;background:linear-gradient(90deg,#fff 0%,#e9fff3 35%,#e8f4ff 65%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:textIn 1.2s .65s both}
.rule{width:min(220px,45vw);height:3px;margin:32px auto 34px;border-radius:9px;background:linear-gradient(90deg,#e31b35 0 33%,#fff 33% 66%,#159447 66%);animation:widen 1.2s 1s both}
.flags{display:flex;justify-content:center;align-items:center;gap:clamp(22px,6vw,65px);flex-wrap:wrap}
.flag-card{width:clamp(150px,27vw,240px);animation:flagFloat 4s ease-in-out infinite}
.flag-card:nth-child(2){animation-delay:-2s}
.flag{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:8px;overflow:hidden;box-shadow:0 13px 35px #0009,0 0 0 1px #ffffff30}
.flag-name{margin-top:13px;font-weight:850;letter-spacing:.2em;font-size:.9rem}
.footer{margin-top:34px;color:#c3d0ca;font-size:.92rem;letter-spacing:.08em;animation:fadeUp 1s 1.3s both}
.heart{color:#ff5367;display:inline-block;animation:heartbeat 1.35s infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes reveal{from{opacity:0;transform:scale(.94);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes textIn{from{opacity:0;transform:translateY(35px);letter-spacing:.12em}to{opacity:1;transform:translateY(0);letter-spacing:-.045em}}
@keyframes widen{from{width:0;opacity:0}to{width:min(220px,45vw);opacity:1}}
@keyframes flagFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stars"></div>
<main class="wrap">
<section class="intro" id="intro">
<p>Birlik • Kardeşlik • İnsanlık</p>
<button class="open" id="openBtn" type="button">MESAJI GÖSTER</button>
</section>
<section class="main" id="main" aria-live="polite">
<div class="eyebrow">BİRLİKTE • OMUZ OMUZA</div>
<h1><span class="line-one">Türkiye – Filistin</span><span class="line-two">Tüm Mazlumlar Kardeştir</span></h1>
<div class="rule"></div>
<div class="flags">
<div class="flag-card">
<svg class="flag" viewBox="0 0 300 200" role="img" aria-label="Türk bayrağı" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#E30A17"/>
  <!-- Standart Türk Bayrağı (G = 200): dış hilal r=50, iç hilal r=40, yıldız çemberi r=25 -->
  <circle cx="75" cy="100" r="50" fill="#FFFFFF"/>
  <circle cx="87.5" cy="100" r="40" fill="#E30A17"/>
  <polygon fill="#FFFFFF" points="202.5,100 185.2,105.6 185.2,123.8 174.5,109.1 157.2,114.7 167.9,100 157.2,85.3 174.5,90.9 185.2,76.2 185.2,94.4"/>
</svg>
<div class="flag-name">TÜRKİYE</div>
</div>
<div class="flag-card">
<svg class="flag" viewBox="0 0 300 200" role="img" aria-label="Filistin bayrağı" xmlns="http://www.w3.org/2000/svg">
<rect width="300" height="66.6667" y="0" fill="#000"/>
<rect width="300" height="66.6667" y="66.6667" fill="#fff"/>
<rect width="300" height="66.6667" y="133.3333" fill="#009639"/>
<path d="M0 0 L120 100 L0 200 Z" fill="#ED1C24"/>
</svg>
<div class="flag-name">FİLİSTİN</div>
</div>
</div>
<div class="footer">İnsanlık için, barış için <span class="heart">♥</span></div>
</section>
</main>
<script>
document.getElementById('openBtn').addEventListener('click',()=>{
 document.getElementById('intro').style.display='none';
 document.getElementById('main').classList.add('show');
});
</script>
</body>
</html>
